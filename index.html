<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Calculo IMC</title>
</head>

<body>

  <main>
    <container class="container">

      <h1 class="title">Calculadora - IMC</h1>

      <div class="input">
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="Ex: jane" />
      </div>

      <div class="input">
        <label for="altura">Altura: </label>
        <input type="number" id="altura" placeholder="Ex: 1.70" />
      </div>

      <div class="input">
        <label for="peso">Peso: </label>
        <input type="number" id="peso" placeholder="Ex: 30.20" />
      </div>

      <!-- button para calcular o IMC -->
      <button type="submit" class="button" id="calcular">Calcular</button>

      <!-- div para mostrar as informaçoes e o resultado do calculo do IMC-->
      <div class="result" id="resultado">Para os campos de altura e peso use sempre (.)  e não  (,)</div>

      <div class="rodape">
        <p id="text-rodape"> Programador Full-Stack: Janedeis Nogueira Praça</p>
      </div>
    </container>
  </main>

  <script src="imc.js"></script>

</body>

</html>
